# AQI Predictor Pro - Configuration File
# Customize app behavior and appearance

# ============================================================================
# COLOR THEME CONFIGURATION
# ============================================================================
[theme]
primary_color = #00D9FF          # Main accent color (cyan)
secondary_color = #FF6B9D        # Secondary accent (pink)
accent_color = #FFD700           # Highlight color (gold)
dark_bg = #0F1419                # Dark background
card_bg = #1A1F2E                # Card background
text_primary = #FFFFFF           # Primary text
text_secondary = #B0B8C1         # Secondary text

# ============================================================================
# MODEL CONFIGURATION
# ============================================================================
[models]
# Random Forest parameters
random_forest_n_estimators = 100
random_forest_max_depth = None
random_forest_min_samples_split = 2

# Neural Network parameters
neural_network_hidden_layers = (100, 50)
neural_network_max_iter = 1000
neural_network_learning_rate = adaptive

# SVM parameters
svm_kernel = rbf
svm_c = 1.0

# Decision Tree parameters
decision_tree_max_depth = None
decision_tree_min_samples_split = 2

# ============================================================================
# DATA CONFIGURATION
# ============================================================================
[data]
# Test/train split ratio
test_size = 0.2

# Default random state for reproducibility
random_state = 42

# Required columns in dataset
required_columns = PM2.5, PM10, NO2, CO, SO2, O3, Temperature, Humidity, Wind_Speed, AQI

# ============================================================================
# AQI HEALTH IMPACT SCALE
# ============================================================================
[aqi_scale]
# Good air quality
good_min = 0
good_max = 50
good_category = Good

# Satisfactory
satisfactory_min = 51
satisfactory_max = 100
satisfactory_category = Satisfactory

# Moderately Polluted
moderate_min = 101
moderate_max = 200
moderate_category = Moderately Polluted

# Poor
poor_min = 201
poor_max = 300
poor_category = Poor

# Very Poor
very_poor_min = 301
very_poor_category = Very Poor

# ============================================================================
# UI CONFIGURATION
# ============================================================================
[ui]
# Page title
page_title = AQI Predictor Pro

# Page icon
page_icon = 🌍

# Layout
layout = wide

# Sidebar state (expanded or collapsed)
sidebar_state = expanded

# ============================================================================
# PREPROCESSING OPTIONS
# ============================================================================
[preprocessing]
# Missing value handling methods
missing_value_methods = Drop rows, Forward fill, Backward fill, Mean imputation

# Outlier detection methods
outlier_methods = None, IQR method, Z-score (±3)

# Default missing value handling
default_missing_method = Drop rows

# Default outlier detection
default_outlier_method = IQR method

# ============================================================================
# PREDICTION INPUT UNITS
# ============================================================================
[units]
temperature = °C
humidity = %
wind_speed = m/s
pollutants = µg/m³

# ============================================================================
# VISUALIZATION CONFIGURATION
# ============================================================================
[visualization]
# Plotly template
plotly_template = plotly_dark

# Chart height (pixels)
chart_height = 500
metric_chart_height = 400

# Number of bins for histograms
histogram_bins = 30

# Correlation heatmap colorscale
heatmap_colorscale = RdBu

# ============================================================================
# APPLICATION INFO
# ============================================================================
[info]
app_name = AQI Predictor Pro
version = 1.0.0
author = Machine Learning Team
description = Advanced Air Quality Index Prediction Using Machine Learning
year = 2024

# ============================================================================
# FEATURE DESCRIPTIONS
# ============================================================================
[features]
PM2_5 = Fine particulate matter (diameter < 2.5 micrometers)
PM10 = Coarse particulate matter (diameter < 10 micrometers)
NO2 = Nitrogen dioxide - produced by combustion processes
CO = Carbon monoxide - colorless gas from incomplete combustion
SO2 = Sulfur dioxide - byproduct of fossil fuel combustion
O3 = Ozone - secondary pollutant formed in atmosphere
Temperature = Ambient air temperature
Humidity = Relative humidity level
Wind_Speed = Wind speed affecting pollutant dispersion
AQI = Air Quality Index - composite indicator

# ============================================================================
# MODEL RECOMMENDATIONS
# ============================================================================
[recommendations]
recommended_model = Random Forest
for_beginners = Linear Regression
for_accuracy = Random Forest
for_interpretability = Decision Tree
for_complex_patterns = Neural Network
for_small_datasets = SVM
